<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daymark</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f8fafc);
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
    }

    .app {
      max-width: 620px;
      margin: auto;
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .header {
      text-align: center;
    }

    h1 {
      color: #312e81;
      margin: 0;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 25px;
    }

    .entry {
      display: flex;
      gap: 10px;
    }

    #taskInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin: 20px 0;
    }

    .filters button {
      background: #64748b;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .task-text {
      flex: 1;
      color: #334155;
    }

    .completed {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .remove {
      background: #ef4444;
    }

    #emptyMessage {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
    }

    @media (max-width: 500px) {
      .entry {
        flex-direction: column;
      }

      .app {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>Daymark</h1>
      <p class="subtitle">Plan your day, one task at a time.</p>
    </div>

    <div class="entry">
      <input
        type="text"
        id="taskInput"
        placeholder="What needs to be done?"
      >

      <button id="addButton">Add Task</button>
    </div>

    <div class="filters">
      <button onclick="filterTasks('all')">All</button>
      <button onclick="filterTasks('active')">Active</button>
      <button onclick="filterTasks('completed')">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <p id="emptyMessage">Your day is clear.</p>

  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const addButton = document.getElementById("addButton");
    const taskList = document.getElementById("taskList");
    const emptyMessage = document.getElementById("emptyMessage");

    addButton.addEventListener("click", addTask);

    taskInput.addEventListener("keypress", function (event) {
      if (event.key === "Enter") {
        addTask();
      }
    });

    function addTask() {
      const task = taskInput.value.trim();

      if (task === "") {
        return;
      }

      const item = document.createElement("li");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";

      const text = document.createElement("span");
      text.textContent = task;
      text.className = "task-text";

      checkbox.addEventListener("change", function () {
        text.classList.toggle("completed");
      });

      const removeButton = document.createElement("button");
      removeButton.textContent = "Remove";
      removeButton.className = "remove";

      removeButton.addEventListener("click", function () {
        item.remove();
        updateMessage();
      });

      item.appendChild(checkbox);
      item.appendChild(text);
      item.appendChild(removeButton);

      taskList.appendChild(item);

      taskInput.value = "";
      taskInput.focus();

      updateMessage();
    }

    function filterTasks(filter) {
      const tasks = taskList.querySelectorAll("li");

      tasks.forEach(function (task) {
        const completed = task.querySelector("input").checked;

        if (filter === "all") {
          task.style.display = "flex";
        } else if (filter === "active") {
          task.style.display = completed ? "none" : "flex";
        } else {
          task.style.display = completed ? "flex" : "none";
        }
      });
    }

    function updateMessage() {
      emptyMessage.style.display =
        taskList.children.length === 0 ? "block" : "none";
    }
  </script>

</body>
</html>
